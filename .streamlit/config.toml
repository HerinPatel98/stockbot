[theme]
base = "light"
# Primary accent for active buttons, tabs, sliders, and highlights
primaryColor = "#0284c7"

# Canvas background
backgroundColor = "#e6edf5"

# Secondary surface for sidebar, metric containers, and input boxes
secondaryBackgroundColor = "#ffffff"

# Dark text for readable labels and input values
textColor = "#0f172a"

# Clean sans-serif typography
font = "sans serif"

[server]
headless = true